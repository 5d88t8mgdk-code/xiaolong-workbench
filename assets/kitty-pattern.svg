<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="bg-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- 背景渐变 -->
      <rect width="200" height="200" fill="#fff7fa"/>
      <!-- 云朵 -->
      <g fill="#cee3f7" opacity="0.5">
        <ellipse cx="30" cy="30" rx="14" ry="9"/>
        <ellipse cx="38" cy="28" rx="10" ry="8"/>
        <ellipse cx="22" cy="32" rx="9" ry="7"/>
      </g>
      <g fill="#cee3f7" opacity="0.5">
        <ellipse cx="170" cy="60" rx="14" ry="9"/>
        <ellipse cx="178" cy="58" rx="10" ry="8"/>
      </g>
      <!-- 蝴蝶结 -->
      <g fill="#ffc1d4" opacity="0.7">
        <ellipse cx="60" cy="80" rx="7" ry="5"/>
        <ellipse cx="68" cy="80" rx="7" ry="5"/>
        <circle cx="64" cy="80" r="3" fill="#ff5a8d"/>
      </g>
      <g fill="#ffc1d4" opacity="0.7">
        <ellipse cx="140" cy="140" rx="7" ry="5"/>
        <ellipse cx="148" cy="140" rx="7" ry="5"/>
        <circle cx="144" cy="140" r="3" fill="#ff5a8d"/>
      </g>
      <!-- 小心心 -->
      <text x="100" y="50" font-size="12" fill="#ffb1c6" opacity="0.7">♥</text>
      <text x="20" y="160" font-size="10" fill="#ffb1c6" opacity="0.7">♥</text>
      <!-- 烟花 -->
      <g transform="translate(110,170)" opacity="0.6">
        <line x1="0" y1="-6" x2="0" y2="6" stroke="#7eb8e6" stroke-width="0.5"/>
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#7eb8e6" stroke-width="0.5"/>
        <line x1="-4" y1="-4" x2="4" y2="4" stroke="#7eb8e6" stroke-width="0.5"/>
        <line x1="-4" y1="4" x2="4" y2="-4" stroke="#7eb8e6" stroke-width="0.5"/>
      </g>
      <g transform="translate(40,100)" opacity="0.6">
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#7eb8e6" stroke-width="0.5"/>
        <line x1="-5" y1="0" x2="5" y2="0" stroke="#7eb8e6" stroke-width="0.5"/>
        <line x1="-3.5" y1="-3.5" x2="3.5" y2="3.5" stroke="#7eb8e6" stroke-width="0.5"/>
        <line x1="-3.5" y1="3.5" x2="3.5" y2="-3.5" stroke="#7eb8e6" stroke-width="0.5"/>
      </g>
      <!-- 小猫头像（可爱Kitty简化版） -->
      <g transform="translate(95,95)">
        <!-- 耳朵 -->
        <path d="M-12,-2 Q-15,-12 -8,-12 Q-2,-10 -2,-2 Z" fill="#fff" stroke="#222" stroke-width="0.6"/>
        <path d="M12,-2 Q15,-12 8,-12 Q2,-10 2,-2 Z" fill="#fff" stroke="#222" stroke-width="0.6"/>
        <!-- 脸 -->
        <ellipse cx="0" cy="6" rx="14" ry="12" fill="#fff" stroke="#222" stroke-width="0.6"/>
        <!-- 蝴蝶结 -->
        <ellipse cx="-6" cy="-7" rx="3" ry="2.5" fill="#ff7aa8"/>
        <ellipse cx="0" cy="-7" rx="3" ry="2.5" fill="#ff7aa8"/>
        <circle cx="-3" cy="-7" r="1.5" fill="#ff5a8d"/>
        <!-- 眼睛 -->
        <circle cx="-5" cy="4" r="1.5" fill="#222"/>
        <circle cx="5" cy="4" r="1.5" fill="#222"/>
        <!-- 鼻子 -->
        <ellipse cx="0" cy="9" rx="1.2" ry="1" fill="#ffb1c6"/>
        <!-- 嘴 -->
        <path d="M-2,12 Q0,14 2,12" fill="none" stroke="#222" stroke-width="0.8" stroke-linecap="round"/>
        <!-- 腮红 -->
        <circle cx="-9" cy="9" r="2" fill="#ffb1c6" opacity="0.5"/>
        <circle cx="9" cy="9" r="2" fill="#ffb1c6" opacity="0.5"/>
      </g>
      <!-- 星星 -->
      <text x="155" y="20" font-size="10" fill="#ffb1c6" opacity="0.7">✦</text>
      <text x="50" y="20" font-size="10" fill="#ffb1c6" opacity="0.7">✧</text>
      <text x="150" y="170" font-size="10" fill="#ffb1c6" opacity="0.7">✦</text>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg-pattern)"/>
</svg>