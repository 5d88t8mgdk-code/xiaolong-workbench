<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 弓步蹲 -->
  <circle cx="95" cy="50" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="95" y1="60" x2="105" y2="125" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="75" x2="75" y2="110" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="95" y1="75" x2="120" y2="115" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 前腿弯曲 -->
  <line x1="105" y1="125" x2="80" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 后腿伸直 -->
  <line x1="105" y1="125" x2="150" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">弓步蹲</text>
