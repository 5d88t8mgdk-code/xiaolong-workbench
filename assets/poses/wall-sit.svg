<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <!-- 墙壁 -->
  <line x1="40" y1="20" x2="40" y2="170" stroke="#aaa" stroke-width="3"/>
  <!-- 靠墙静蹲 -->
  <circle cx="60" cy="60" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="65" y1="70" x2="60" y2="115" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="115" x2="115" y2="115" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂 -->
  <line x1="65" y1="80" x2="50" y2="120" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="80" x2="80" y2="125" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 大腿水平 -->
  <line x1="115" y1="115" x2="100" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="115" y1="115" x2="125" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">靠墙静蹲</text>
  <text x="100" y="190" text-anchor="middle" font-size="9" fill="#999">30 秒 × 3 组</text>
</svg>