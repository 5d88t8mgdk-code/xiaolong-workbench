<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <!-- 身体 -->
  <line x1="100" y1="60" x2="100" y2="150" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂自然下垂 -->
  <line x1="100" y1="80" x2="70" y2="130" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="80" x2="130" y2="130" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 头部 - 略向右倾 -->
  <circle cx="105" cy="45" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <!-- 颈部圆弧箭头表示绕环 -->
  <path d="M 95 30 Q 100 22, 110 30" fill="none" stroke="#ff5a8d" stroke-width="2" stroke-dasharray="3,2"/>
  <path d="M 110 28 L 113 26 L 112 30" fill="#ff5a8d"/>
  <!-- 双腿 -->
  <line x1="100" y1="150" x2="80" y2="195" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="150" x2="120" y2="195" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 标签 -->
  <text x="100" y="20" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">颈部绕环</text>
</svg>