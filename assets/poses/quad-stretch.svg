<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 站姿股四头肌拉伸：单脚站立，另一脚向后拉 -->
  <circle cx="80" cy="50" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="80" y1="60" x2="100" y2="130" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 左臂下垂 -->
  <line x1="80" y1="75" x2="65" y2="135" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 右臂向后抓住脚 -->
  <line x1="80" y1="75" x2="125" y2="120" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="120" x2="135" y2="135" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 支撑腿 -->
  <line x1="100" y1="130" x2="105" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 弯曲腿 -->
  <line x1="135" y1="135" x2="155" y2="140" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="155" y1="140" x2="135" y2="120" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">股四头肌拉伸</text>
</svg>