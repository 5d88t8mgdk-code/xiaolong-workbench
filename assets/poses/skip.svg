<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 跳绳 -->
  <circle cx="100" cy="45" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="100" y1="55" x2="100" y2="130" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="70" x2="60" y2="100" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="70" x2="140" y2="100" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 跳绳弧线 -->
  <path d="M 40 105 Q 100 175, 160 105" fill="none" stroke="#ff5a8d" stroke-width="2" stroke-dasharray="3,2"/>
  <!-- 双脚微跳 -->
  <line x1="100" y1="130" x2="85" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="130" x2="115" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
