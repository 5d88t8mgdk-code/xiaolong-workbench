<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://1.0/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 侧平举：双臂水平侧展 -->
  <circle cx="100" cy="45" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="100" y1="55" x2="100" y2="150" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="70" x2="30" y2="80" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="70" x2="170" y2="80" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 哑铃 -->
  <circle cx="28" cy="80" r="5" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="172" cy="80" r="5" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="150" x2="80" y2="195" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="150" x2="120" y2="195" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">侧平举</text>
</svg>