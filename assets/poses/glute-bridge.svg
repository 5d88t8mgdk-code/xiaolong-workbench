<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 臀桥：仰卧，臀部抬起 -->
  <circle cx="45" cy="130" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="55" y1="135" x2="155" y2="135" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 臀部下拱 -->
  <path d="M 90 135 Q 110 105, 130 135" fill="none" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 肩着地 -->
  <line x1="55" y1="135" x2="35" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="55" y1="135" x2="45" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双腿弯曲 -->
  <line x1="155" y1="135" x2="155" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="155" y1="170" x2="135" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">臀桥</text>
</svg>