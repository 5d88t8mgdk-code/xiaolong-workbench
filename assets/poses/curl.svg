<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 哑铃弯举：双臂弯曲抬起 -->
  <circle cx="100" cy="45" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="100" y1="55" x2="100" y2="150" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂弯曲 -->
  <line x1="100" y1="70" x2="70" y2="100" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="100" x2="85" y2="80" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="70" x2="130" y2="100" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="130" y1="100" x2="115" y2="80" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 哑铃 -->
  <circle cx="85" cy="78" r="5" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="115" cy="78" r="5" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="150" x2="80" y2="195" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="150" x2="120" y2="195" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">哑铃弯举</text>
</svg>