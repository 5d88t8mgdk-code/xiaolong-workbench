<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 波比跳：跳起姿态 -->
  <circle cx="100" cy="30" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="100" y1="40" x2="100" y2="120" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="55" x2="70" y2="35" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="55" x2="130" y2="35" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双腿弯曲准备落地 -->
  <line x1="100" y1="120" x2="85" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="115" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="20" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">波比跳</text>
</svg>