<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 开合跳：双臂双腿打开 -->
  <circle cx="100" cy="45" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="100" y1="55" x2="100" y2="140" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂斜上举 -->
  <line x1="100" y1="65" x2="55" y2="35" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="65" x2="145" y2="35" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双腿分开 -->
  <line x1="100" y1="140" x2="65" y2="190" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="140" x2="135" y2="190" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">开合跳</text>
</svg>