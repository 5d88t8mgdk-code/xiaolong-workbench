<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="155" x2="180" y2="155" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 卧推凳 -->
  <rect x="35" y="130" width="130" height="20" fill="none" stroke="#aaa" stroke-width="2"/>
  <!-- 仰卧 -->
  <circle cx="60" cy="130" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="70" y1="135" x2="140" y2="135" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂伸直举杠 -->
  <line x1="70" y1="135" x2="80" y2="95" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="95" x2="125" y2="95" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="95" x2="135" y2="135" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 杠铃 -->
  <line x1="75" y1="90" x2="135" y2="90" stroke="#333" stroke-width="3"/>
  <circle cx="75" cy="90" r="6" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="135" cy="90" r="6" fill="none" stroke="#333" stroke-width="2"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">哑铃卧推</text>
</svg>