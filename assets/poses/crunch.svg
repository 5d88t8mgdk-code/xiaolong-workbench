<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 仰卧卷腹：膝盖弯曲，上身抬起 -->
  <circle cx="70" cy="90" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <!-- 上身斜抬 -->
  <line x1="75" y1="100" x2="120" y2="130" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂抱头 -->
  <line x1="75" y1="100" x2="65" y2="85" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="85" x2="80" y2="90" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="100" x2="90" y2="85" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 大腿 -->
  <line x1="120" y1="130" x2="125" y2="165" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="165" x2="145" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">卷腹</text>
</svg>