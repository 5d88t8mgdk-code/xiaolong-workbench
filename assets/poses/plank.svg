<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="170" x2="180" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 平板支撑 -->
  <circle cx="45" cy="110" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <!-- 身体水平 -->
  <line x1="55" y1="115" x2="155" y2="125" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 前臂着地 -->
  <line x1="55" y1="115" x2="40" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="170" x2="70" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 腿 -->
  <line x1="155" y1="125" x2="165" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="165" y1="170" x2="140" y2="170" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">平板支撑</text>
  <text x="100" y="190" text-anchor="middle" font-size="9" fill="#999">保持 30 秒</text>
</svg>