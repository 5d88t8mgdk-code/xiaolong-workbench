<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="155" x2="180" y2="155" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 仰卧抬腿 -->
  <circle cx="50" cy="130" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="60" y1="135" x2="100" y2="135" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="135" x2="40" y2="155" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双腿抬起约 60 度 -->
  <line x1="100" y1="135" x2="140" y2="90" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="135" x2="150" y2="95" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">仰卧抬腿</text>
</svg>