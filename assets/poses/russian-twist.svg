<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="160" x2="180" y2="160" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 坐姿扭转：双膝弯曲，身体向一侧扭转 -->
  <circle cx="80" cy="90" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <!-- 身体微向后倾 -->
  <line x1="85" y1="100" x2="120" y2="135" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂前伸握拳 -->
  <line x1="85" y1="100" x2="55" y2="115" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="85" y1="100" x2="60" y2="130" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="55" cy="115" r="4" fill="#5b9bff"/>
  <!-- 小腿抬起 -->
  <line x1="120" y1="135" x2="115" y2="155" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="115" y1="155" x2="135" y2="160" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 扭转箭头 -->
  <path d="M 60 95 Q 50 80, 65 75" fill="none" stroke="#ff5a8d" stroke-width="2" marker-end="url(#c)"/>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff5a8d"/></marker></defs>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">俄罗斯转体</text>
</svg>