<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fdf6f0"/>
  <line x1="20" y1="130" x2="180" y2="130" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 仰卧扭转：身体平躺，双腿倒向一侧 -->
  <circle cx="50" cy="100" r="10" fill="#ffd5b8" stroke="#5b9bff" stroke-width="2.5"/>
  <line x1="60" y1="105" x2="140" y2="105" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双臂展开 -->
  <line x1="60" y1="105" x2="30" y2="85" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="105" x2="30" y2="125" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 双腿向右下倒 -->
  <line x1="140" y1="105" x2="170" y2="145" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="170" y1="145" x2="150" y2="145" stroke="#5b9bff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="25" text-anchor="middle" font-size="11" fill="#5b9bff" font-weight="bold">仰卧扭转</text>
  <text x="100" y="190" text-anchor="middle" font-size="9" fill="#999">左右各 30 秒</text>
</svg>