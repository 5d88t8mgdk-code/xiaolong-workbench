<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ffd6e2"/>
    </radialGradient>
    <linearGradient id="bowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7aa8"/>
      <stop offset="100%" stop-color="#ff5a8d"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)"/>
  <!-- 左耳 -->
  <path d="M22,38 Q15,18 30,18 Q45,20 48,42 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <!-- 右耳 -->
  <path d="M98,38 Q105,18 90,18 Q75,20 72,42 Z" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <!-- 脸 -->
  <ellipse cx="60" cy="62" rx="38" ry="36" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <!-- 蝴蝶结（左大右小） -->
  <g transform="translate(28,28)">
    <ellipse cx="-7" cy="0" rx="9" ry="8" fill="url(#bowGrad)" stroke="#222" stroke-width="1"/>
    <ellipse cx="7" cy="0" rx="9" ry="8" fill="url(#bowGrad)" stroke="#222" stroke-width="1"/>
    <circle cx="0" cy="0" r="4.5" fill="#ff5a8d" stroke="#222" stroke-width="1"/>
    <ellipse cx="-13" cy="0" rx="4" ry="3" fill="#fff" stroke="#222" stroke-width="1"/>
    <ellipse cx="13" cy="0" rx="4" ry="3" fill="#fff" stroke="#222" stroke-width="1"/>
  </g>
  <!-- 眼睛 -->
  <ellipse cx="46" cy="60" rx="3.5" ry="4.5" fill="#222"/>
  <ellipse cx="74" cy="60" rx="3.5" ry="4.5" fill="#222"/>
  <circle cx="47" cy="58" r="1.2" fill="#fff"/>
  <circle cx="75" cy="58" r="1.2" fill="#fff"/>
  <!-- 鼻子 -->
  <ellipse cx="60" cy="70" rx="2.5" ry="2" fill="#ffb1c6" stroke="#222" stroke-width="0.5"/>
  <!-- 嘴 -->
  <path d="M55,76 Q60,80 65,76" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 左胡须 -->
  <line x1="20" y1="68" x2="40" y2="72" stroke="#222" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="74" x2="40" y2="76" stroke="#222" stroke-width="1" stroke-linecap="round"/>
  <!-- 右胡须 -->
  <line x1="80" y1="72" x2="100" y2="68" stroke="#222" stroke-width="1" stroke-linecap="round"/>
  <line x1="80" y1="76" x2="100" y2="74" stroke="#222" stroke-width="1" stroke-linecap="round"/>
  <!-- 腮红 -->
  <circle cx="36" cy="74" r="5" fill="#ffd0db" opacity="0.7"/>
  <circle cx="84" cy="74" r="5" fill="#ffd0db" opacity="0.7"/>
</svg>